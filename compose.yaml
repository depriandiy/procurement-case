
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - app_storage:/var/www/html/storage
    environment:
      APP_NAME: Portal Penawaran Supplier
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${APP_PORT:-8000}
      APP_TIMEZONE: Asia/Jakarta
      APP_LOCALE: id
      APP_FALLBACK_LOCALE: id
      APP_FAKER_LOCALE: id_ID
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: portal_supplier
      DB_USERNAME: portal_user
      DB_PASSWORD: local_dev_password
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-password}
      MAIL_MAILER: log
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - 'exit(@file_get_contents("http://127.0.0.1:8000/up") === false ? 1 : 0);'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: portal_supplier
      MYSQL_USER: portal_user
      MYSQL_PASSWORD: local_dev_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  app_storage:
